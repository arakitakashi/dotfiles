<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Interactive course</title>
    <meta name="description" content="図を 1 ステップずつ動かしながら学ぶインタラクティブなコース。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='7' fill='%231f1d1a'/%3E%3Cpath d='M10 20.500 16 11l6 9.500' fill='none' stroke='%23d9ecc0' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // 初回描画の前にテーマを決める（ちらつき防止）。手動の選択を優先し、なければ OS の設定に従う。
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>このコースは図を動かしながら学ぶ形式のため、JavaScript を有効にしてください。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
